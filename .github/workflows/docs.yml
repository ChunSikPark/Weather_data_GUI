# The documentation itself now lives in the TeamOverbyeWeather package
# repository. Older releases on PyPI still point their Documentation URL at
# this site, so it is kept alive as a redirect rather than left to 404.
name: Docs redirect

on:
  push:
    branches: [main]
    paths:
      - 'docs-redirect/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
