name: Bug report
description: Something is broken in the Python package or the web portal
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The fields below are the ones that usually decide
        whether a problem can be reproduced, so please fill in what applies.

  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Python package (TeamOverbyeWeather)
        - Web portal (weather-data-gui.pages.dev)
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Code or steps to reproduce
      description: >
        For the package, the smallest snippet that shows the problem. For the
        portal, the source, type and dates you selected.
      render: python
      placeholder: |
        from TeamOverbyeWeather import WeatherClient
        client = WeatherClient()
        client.download("hrrr", type="current", dates="2026-07-21", region="TX")

  - type: textarea
    id: error
    attributes:
      label: Full error message
      description: The complete traceback, not just the last line.
      render: text

  - type: input
    id: version
    attributes:
      label: Package version
      description: "`import TeamOverbyeWeather; print(TeamOverbyeWeather.__version__)`"
      placeholder: "0.4.0"

  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.11 on Windows 11"

  - type: markdown
    attributes:
      value: |
        **Before filing:** if the error is
        `AttributeError: 'WeatherClient' object has no attribute ...`, you are
        probably on an older version. Run `pip install --upgrade
        TeamOverbyeWeather`, then **restart your kernel** — an already-imported
        module is not replaced by installing over it.
